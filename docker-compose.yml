services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: voxguard
      MONGO_INITDB_ROOT_PASSWORD: voxguard_pass
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
